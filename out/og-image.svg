<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Willfred Studio Photography</title>
  <desc id="desc">Vista previa de la marca con una cámara elegante y texto fotográfico.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="55%" stop-color="#171717"/>
      <stop offset="100%" stop-color="#090909"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="42%">
      <stop offset="0%" stop-color="#f5e8bf" stop-opacity="0.9"/>
      <stop offset="22%" stop-color="#e9d9a4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <g transform="translate(0 0)">
    <rect x="320" y="140" width="520" height="330" rx="28" fill="#121212" stroke="#f1efe8" stroke-width="7"/>
    <rect x="355" y="170" width="170" height="52" rx="14" fill="#181818" stroke="#f1efe8" stroke-width="2"/>
    <circle cx="590" cy="305" r="82" fill="#1a1a1a" stroke="#f1efe8" stroke-width="7"/>
    <circle cx="590" cy="305" r="54" fill="#d9b678" stroke="#f5f4f1" stroke-width="3"/>
    <circle cx="590" cy="305" r="24" fill="#f3f0ea"/>
    <g stroke="#f5f4f1" stroke-width="3" opacity="0.8">
      <line x1="590" y1="220" x2="590" y2="390"/>
      <line x1="505" y1="305" x2="675" y2="305"/>
      <line x1="532" y1="242" x2="648" y2="368"/>
      <line x1="648" y1="242" x2="532" y2="368"/>
    </g>
    <circle cx="745" cy="200" r="30" fill="#f0e6c5" opacity="0.8"/>
  </g>

  <g>
    <text x="150" y="510" font-family="Georgia, serif" font-size="62" letter-spacing="2" fill="#f5f2eb">WILLFRED STUDIO</text>
    <text x="150" y="566" font-family="Arial, sans-serif" font-size="21" letter-spacing="5" fill="#b9b2a7">FOTOGRAFÍA • BODAS • EVENTOS • RETRATOS</text>
  </g>
</svg>
